services:
  db:
    image: postgres:16-alpine
    container_name: vue-app-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vueblog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vueblog}
      POSTGRES_DB: ${DB_NAME:-vueblog}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - vue_app_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vueblog} -d ${DB_NAME:-vueblog}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue-app-test-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside Docker network DB is reachable as service name `db` on 5432
      DB_HOST: db
      DB_PORT: "5432"
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - vue_app_test_uploads:/app/data/uploads

volumes:
  vue_app_test_pgdata:
  vue_app_test_uploads:
